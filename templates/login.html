{% extends 'base.html' %}
{% block title %}Monthly — Log In{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Log In</h2>
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Log In</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
